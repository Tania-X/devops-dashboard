name: Docker Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Server
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/server:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/server:latest

      - name: Build & Push Web (Frontend Nginx)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/web:latest

      - name: Build & Push Agent
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.agent
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/agent:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/agent:latest
