# CodeRabbit AI Code Review 配置
# 文档: https://docs.coderabbit.ai/configuration/auto-review

language: "zh-CN" # 评论使用中文

reviews:
  auto_review:
    enabled: true          # 自动审查每个 PR(默认即 true,显式声明)
    drafts: true           # 也审查 draft PR
    base_branches:
      - "main"             # 目标为 main 的 PR 自动审
