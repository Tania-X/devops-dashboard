openapi: 3.0.3
info:
  title: DevOps Dashboard API
  description: 运维监控仪表盘一期 API 规范（Spec-Driven Development）
  version: 1.0.0
  contact:
    name: DevOps Team

servers:
  - url: http://localhost:8080
    description: Spring Boot 本地开发环境
  - url: /
    description: 前端 MSW Mock 环境（相对路径）

paths:
  /api/auth/login:
    post:
      operationId: login
      summary: 用户登录
      description: 使用用户名密码登录，返回 JWT Token、用户信息和权限点列表
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      operationId: getMe
      summary: 获取当前用户信息
      description: 返回当前登录用户信息及权限点列表（前端按钮/菜单级权限控制依据）
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功返回当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      description: 使当前 Token 失效（客户端清空本地状态即可，服务端尽力处理）
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 退出成功
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/dashboard/metrics:
    get:
      operationId: getDashboardMetrics
      summary: 获取仪表盘当前核心指标
      description: 返回本机实时的 CPU、内存、磁盘使用率及当前告警数（通过 gopsutil 采集）
      tags:
        - Dashboard
      responses:
        '200':
          description: 成功返回当前指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'

  /api/dashboard/trend:
    get:
      operationId: getDashboardTrend
      summary: 获取仪表盘趋势数据
      description: 返回最近 N 小时内本机 CPU 和内存使用率的时序数据（后端定时采集）
      tags:
        - Dashboard
      parameters:
        - name: hours
          in: query
          description: 查询最近多少小时的数据
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 24
      responses:
        '200':
          description: 成功返回趋势数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTrend'

  /api/dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      summary: 获取最近告警列表
      description: 返回最近的系统告警，默认 Top 5
      tags:
        - Dashboard
      parameters:
        - name: limit
          in: query
          description: 返回条数
          schema:
            type: integer
            default: 5
            maximum: 20
      responses:
        '200':
          description: 成功返回告警列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertItem'

  /api/alerts:
    get:
      operationId: getAlertHistory
      summary: 告警历史分页查询
      description: 查询落库的告警历史记录，支持级别筛选与分页（最新在前）
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: 每页条数
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: level
          in: query
          description: 级别筛选（info/warning/critical，空为全部）
          schema:
            type: string
      responses:
        '200':
          description: 成功返回告警历史分页数据
          content:
            application/json:
              schema:
                type: object
                required: [list, total, page, pageSize]
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/servers:
    get:
      operationId: getServerList
      summary: 获取服务器列表
      description: 分页获取服务器资产列表，支持按状态筛选
      tags:
        - Server
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: 每页条数
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          description: 状态筛选
          schema:
            type: string
            enum: [running, stopped, maintenance]
      responses:
        '200':
          description: 成功返回分页服务器列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultServerItem'

  /api/servers/{id}:
    get:
      operationId: getServerDetail
      summary: 获取服务器详情
      description: 根据 ID 获取单台服务器的详细信息（含磁盘、网卡）
      tags:
        - Server
      parameters:
        - name: id
          in: path
          required: true
          description: 服务器 ID
          schema:
            type: string
      responses:
        '200':
          description: 成功返回服务器详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetail'
        '404':
          description: 服务器不存在

  /api/logs:
    get:
      operationId: getLogList
      summary: 获取日志列表
      description: 分页获取系统日志，支持按级别筛选和关键词搜索
      tags:
        - Log
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
        - name: level
          in: query
          description: 日志级别筛选
          schema:
            type: string
            enum: [INFO, WARN, ERROR]
        - name: keyword
          in: query
          description: 内容关键词模糊搜索
          schema:
            type: string
      responses:
        '200':
          description: 成功返回分页日志列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultLogItem'

  /api/deployments:
    get:
      operationId: getDeploymentList
      summary: 获取应用部署列表
      description: 获取所有应用的部署状态概览
      tags:
        - Deployment
      responses:
        '200':
          description: 成功返回部署列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentItem'

  /api/deployments/{id}/history:
    get:
      operationId: getDeploymentHistory
      summary: 获取应用部署历史
      description: 获取某个应用的最近部署记录
      tags:
        - Deployment
      parameters:
        - name: id
          in: path
          required: true
          description: 应用 ID
          schema:
            type: string
      responses:
        '200':
          description: 成功返回部署历史
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentHistoryItem'

  /api/monitor/processes:
    get:
      operationId: getProcessList
      summary: 获取本机进程列表
      description: 返回当前运行中的进程列表，支持按 CPU/内存排序和进程名搜索
      tags:
        - Monitor
      parameters:
        - name: sortBy
          in: query
          description: 排序字段
          schema:
            type: string
            enum: [cpu, memory, pid, name]
            default: cpu
        - name: order
          in: query
          description: 排序方向
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: keyword
          in: query
          description: 进程名关键词模糊搜索
          schema:
            type: string
        - name: limit
          in: query
          description: 返回条数上限（类似 top -n）
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: 成功返回进程列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessItem'

  /api/monitor/processes/{pid}:
    get:
      operationId: getProcessDetail
      summary: 获取进程详情
      description: 根据 PID 获取单个进程的详细资源占用和状态
      tags:
        - Monitor
      parameters:
        - name: pid
          in: path
          required: true
          description: 进程 ID
          schema:
            type: integer
      responses:
        '200':
          description: 成功返回进程详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '404':
          description: 进程不存在或已退出

  /api/monitor/host:
    get:
      operationId: getHostInfo
      summary: 获取主机信息
      description: 返回本机的操作系统、CPU、内存、启动时间等硬件信息
      tags:
        - Monitor
      responses:
        '200':
          description: 成功返回主机信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostInfo'

  /api/settings/webhook:
    get:
      operationId: getWebhookConfig
      summary: 获取告警 Webhook 配置
      description: 返回当前告警推送配置（钉钉/企业微信机器人），secret 密钥不回传
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功返回 Webhook 配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateWebhookConfig
      summary: 更新告警 Webhook 配置
      description: 更新推送开关、渠道类型、Webhook 地址。保存后热生效（重建 Notifier）。
      tags:
        - Settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfigUpdate'
      responses:
        '200':
          description: 更新成功，返回最新配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfig'
        '400':
          description: 参数校验失败（URL 非法 / kind 不支持）
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/webhook/test:
    post:
      operationId: testWebhookConfig
      summary: 发送测试告警到 Webhook
      description: 按当前配置向目标 URL 发送一条测试告警消息，用于验证渠道连通性
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 测试消息已发送
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
                  detail:
                    type: string
                    description: 发送结果详情（HTTP 状态或错误信息）
        '400':
          description: 未配置 Webhook 或 URL 为空
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/alert-thresholds:
    get:
      operationId: getAlertThresholds
      summary: 获取告警阈值配置
      description: 返回各指标（CPU/内存/磁盘）当前生效的告警阈值（DB 有配置则返回配置值，否则默认值）
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功返回阈值列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertThreshold'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateAlertThreshold
      summary: 更新告警阈值
      description: 更新指定指标的 warning/critical 阈值，校验 warn < crit。保存后热生效（下次采集即用新阈值）
      tags:
        - Settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertThresholdRequest'
      responses:
        '200':
          description: 更新成功，返回最新阈值列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertThreshold'
        '400':
          description: 参数校验失败（指标不支持 / warn >= crit）
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/roles:
    post:
      operationId: createRole
      summary: 创建自定义角色
      description: 创建空权限的自定义角色（默认无任何权限，需后续配置）
      tags:
        - Settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                  label:
                    type: string
        '400':
          description: 参数错误（重名 / 内置名保留 / 非法名称）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无 settings:manage 权限
    get:
      operationId: listRoles
      summary: 获取角色权限配置
      description: 返回全部角色及其权限点（供权限配置页矩阵渲染），admin 为通配策略锁定
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功返回角色列表
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无 settings:manage 权限

  /api/settings/permissions:
    get:
      operationId: listPermissionGroups
      summary: 获取权限点分组清单
      description: 返回权限点分组（obj 分组 + 中文标签），供权限矩阵按组渲染
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功返回权限点分组
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionGroup'

  /api/settings/roles/{role}:
    put:
      operationId: updateRolePermissions
      summary: 更新角色权限点
      description: 覆盖更新指定角色的权限点集合并热生效（无需重新登录）。admin 角色为通配策略，不可修改。
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            example: operator
          description: 角色名（admin / operator / viewer）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePermissionsRequest'
      responses:
        '200':
          description: 更新成功，返回该角色最新权限点
          content:
            application/json:
              schema:
                type: object
                required: [role, permissions]
                properties:
                  role:
                    type: string
                    example: operator
                  permissions:
                    type: array
                    items:
                      type: string
                      example: 'agent:deploy'
        '400':
          description: 参数错误（admin 锁定 / 未知角色 / 非法权限点）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无 settings:manage 权限
    delete:
      operationId: deleteRole
      summary: 删除自定义角色
      description: 内置角色不可删；有用户绑定的角色不可删（需先转移用户）；删除时清理其 Casbin 策略
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
          description: 角色名
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                  deleted:
                    type: boolean
        '400':
          description: 参数错误（内置角色 / 有用户绑定 / 未知角色）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无 settings:manage 权限

  /api/settings/roles/{role}/meta:
    put:
      operationId: updateRoleMeta
      summary: 更新角色显示名/描述
      description: 角色名称不可修改；内置角色显示名锁定（仅改描述）
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
          description: 角色名
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
        '400':
          description: 参数错误（内置角色显示名不可改 / 未知角色）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无 settings:manage 权限

  /api/settings/audit-logs:
    get:
      operationId: listAuditLogs
      summary: 分页查询审计日志
      description: 返回敏感管理操作日志（角色/权限/用户增删改），按时间倒序
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功返回审计日志分页
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无 settings:manage 权限

  /api/agents:
    get:
      operationId: getAgentList
      summary: 获取 Agent 目标列表
      description: 返回所有已配置的 Agent 分发目标
      tags:
        - Agent
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功返回 Agent 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTarget'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAgent
      summary: 新增 Agent 目标
      description: 创建新的 Agent 分发目标（密码仅入站，不存储明文序列化）
      tags:
        - Agent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTarget'
        '400':
          description: 参数校验失败
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/agents/{id}:
    put:
      operationId: updateAgent
      summary: 更新 Agent 目标
      description: 更新指定 Agent 的配置（密码留空表示不修改）
      tags:
        - Agent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTarget'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteAgent
      summary: 删除 Agent 目标
      tags:
        - Agent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/agents/{id}/deploy:
    post:
      operationId: deployAgent
      summary: 部署 Agent 到目标机
      description: 通过 SSH 将 Agent 二进制部署到目标服务器
      tags:
        - Agent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 部署已触发
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/agents/{id}/stop:
    post:
      operationId: stopAgent
      summary: 停止目标机上的 Agent
      tags:
        - Agent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 停止指令已发送
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/agents/{id}/status:
    get:
      operationId: checkAgentStatus
      summary: 检查 Agent 运行状态
      tags:
        - Agent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent 运行状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users:
    get:
      operationId: getUserList
      summary: 获取用户列表（仅管理员）
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功返回用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createUser
      summary: 新增用户（仅管理员）
      description: 创建新用户，密码仅出现在请求中
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/{id}:
    put:
      operationId: updateUser
      summary: 更新用户（仅管理员）
      description: 更新用户角色或密码（密码留空表示不修改）
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteUser
      summary: 删除用户（仅管理员）
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "登录后返回的 JWT Token，格式：Authorization: Bearer <token>"
  responses:
    Unauthorized:
      description: 未认证或 Token 无效
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "unauthorized"
  schemas:
    # ---------- Dashboard ----------
    DashboardMetrics:
      type: object
      required: [cpu, memory, disk, alertCount]
      properties:
        cpu:
          $ref: '#/components/schemas/MetricValue'
        memory:
          $ref: '#/components/schemas/MetricValue'
        disk:
          $ref: '#/components/schemas/MetricValue'
        alertCount:
          type: integer
          description: 未恢复告警总数

    MetricValue:
      type: object
      required: [current, status]
      properties:
        current:
          type: number
          description: 当前百分比值
          example: 45.2
        status:
          type: string
          enum: [normal, warning, critical]
          description: normal < 60, warning < 80, critical >= 80

    DashboardTrend:
      type: object
      required: [timeLabels, cpuData, memoryData]
      properties:
        timeLabels:
          type: array
          items:
            type: string
          description: 时间标签数组，如 ["14:00", "15:00"]
          example: ["14:00", "15:00", "16:00", "17:00", "18:00", "19:00"]
        cpuData:
          type: array
          items:
            type: number
          description: CPU 使用率时序数据
        memoryData:
          type: array
          items:
            type: number
          description: 内存使用率时序数据

    AlertItem:
      type: object
      required: [id, level, message, source, time]
      properties:
        id:
          type: string
        level:
          type: string
          enum: [info, warning, critical]
        message:
          type: string
          example: "CPU 使用率超过 80%，当前 87%"
        source:
          type: string
          description: 告警来源，如服务器 IP 或服务名
          example: "192.168.1.10"
        time:
          type: string
          format: date-time
          example: "2026-07-18T14:32:00Z"

    Alert:
      type: object
      required: [id, level, message, source, time]
      properties:
        id:
          type: integer
        level:
          type: string
          enum: [info, warning, critical]
        message:
          type: string
        source:
          type: string
        time:
          type: string
          description: 展示格式 "01-02 15:04"
          example: "08-16 02:30"
        createdAt:
          type: string
          format: date-time
          description: 落库时间（排序依据）

    # ---------- Server ----------
    ServerItem:
      type: object
      required: [id, hostname, ip, os, cpuCores, memoryGb, status, uptime]
      properties:
        id:
          type: string
        hostname:
          type: string
          example: "prod-web-01"
        ip:
          type: string
          example: "192.168.1.10"
        os:
          type: string
          example: "CentOS 7.9"
        cpuCores:
          type: integer
          example: 8
        memoryGb:
          type: integer
          example: 32
        status:
          type: string
          enum: [running, stopped, maintenance]
        uptime:
          type: string
          description: 运行时长，人工可读格式
          example: "15d 3h 24m"

    PagedResultServerItem:
      type: object
      required: [list, total, page, pageSize]
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ServerItem'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    ServerDetail:
      allOf:
        - $ref: '#/components/schemas/ServerItem'
        - type: object
          required: [diskPartitions, networkInterfaces]
          properties:
            diskPartitions:
              type: array
              items:
                $ref: '#/components/schemas/DiskPartition'
            networkInterfaces:
              type: array
              items:
                $ref: '#/components/schemas/NetworkInterface'

    DiskPartition:
      type: object
      required: [mount, totalGb, usedGb]
      properties:
        mount:
          type: string
          example: "/"
        totalGb:
          type: integer
          example: 500
        usedGb:
          type: integer
          example: 320

    NetworkInterface:
      type: object
      required: [name, ip, mac]
      properties:
        name:
          type: string
          example: "eth0"
        ip:
          type: string
          example: "192.168.1.10"
        mac:
          type: string
          example: "00:16:3e:12:a5:1c"

    # ---------- Log ----------
    LogItem:
      type: object
      required: [id, time, level, service, content]
      properties:
        id:
          type: string
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [INFO, WARN, ERROR]
        service:
          type: string
          example: "order-service"
        content:
          type: string
          example: "数据库连接池达到最大连接数"

    PagedResultLogItem:
      type: object
      required: [list, total, page, pageSize]
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/LogItem'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # ---------- Deployment ----------
    DeploymentItem:
      type: object
      required: [id, appName, version, env, status, lastDeployedAt]
      properties:
        id:
          type: string
        appName:
          type: string
          example: "order-service"
        version:
          type: string
          example: "v2.3.1"
        env:
          type: string
          enum: [dev, test, prod]
        status:
          type: string
          enum: [pending, deploying, success, failed]
        lastDeployedAt:
          type: string
          format: date-time

    DeploymentHistoryItem:
      type: object
      required: [version, operator, durationSec, status, deployedAt]
      properties:
        version:
          type: string
          example: "v2.3.0"
        operator:
          type: string
          example: "zhangsan"
        durationSec:
          type: integer
          description: 部署耗时（秒）
          example: 145
        status:
          type: string
          enum: [success, failed]
        deployedAt:
          type: string
          format: date-time

    # ---------- Monitor ----------
    ProcessItem:
      type: object
      required: [pid, name, cpuPercent, memoryPercent, memoryMb, status]
      properties:
        pid:
          type: integer
          description: 进程 ID
          example: 1428
        name:
          type: string
          description: 进程名
          example: "devops-api"
        cmdline:
          type: string
          description: 启动命令行
          example: "./devops-api"
        cpuPercent:
          type: number
          description: CPU 使用率 (%)
          example: 12.5
        memoryPercent:
          type: number
          description: 内存占用率 (%)
          example: 3.2
        memoryMb:
          type: number
          description: 占用内存大小 (MB)
          example: 256.0
        status:
          type: string
          description: 进程状态
          example: "running"

    ProcessDetail:
      allOf:
        - $ref: '#/components/schemas/ProcessItem'
        - type: object
          required: [ppid, numThreads, numOpenFiles, numConnections, createTime, username]
          properties:
            ppid:
              type: integer
              description: 父进程 ID
              example: 1
            numThreads:
              type: integer
              description: 线程数
              example: 8
            numOpenFiles:
              type: integer
              description: 打开的文件描述符数量
              example: 24
            numConnections:
              type: integer
              description: 网络连接数
              example: 5
            createTime:
              type: string
              format: date-time
              description: 进程启动时间
            username:
              type: string
              description: 运行该进程的用户
              example: "apple"
            workingDir:
              type: string
              description: 工作目录
              example: "/Users/apple/devops-dashboard/backend"
            env:
              type: array
              items:
                type: string
              description: 环境变量列表（脱敏后可返回）
              example: ["PATH=/usr/bin", "HOME=/Users/apple"]

    HostInfo:
      type: object
      required: [hostname, os, platform, platformVersion, kernelVersion, arch, bootTime, uptime, cpuModel, cpuCores, totalMemoryGb]
      properties:
        hostname:
          type: string
          example: "MacBook-Pro"
        os:
          type: string
          description: 操作系统类型
          example: "darwin"
        platform:
          type: string
          description: 平台名称
          example: "macOS"
        platformVersion:
          type: string
          example: "15.3.1"
        kernelVersion:
          type: string
          example: "24.3.0"
        arch:
          type: string
          description: 架构
          example: "arm64"
        bootTime:
          type: string
          format: date-time
          description: 系统启动时间
        uptime:
          type: string
          description: 运行时长，人工可读格式
          example: "3d 12h 45m"
        cpuModel:
          type: string
          example: "Apple M3 Pro"
        cpuCores:
          type: integer
          description: 物理核心数
          example: 11
        cpuLogicalCores:
          type: integer
          description: 逻辑核心数
          example: 11
        totalMemoryGb:
          type: number
          description: 总内存 (GB)
          example: 36.0
        virtualMemoryGb:
          type: number
          description: 虚拟内存 / 交换分区总量 (GB)
          example: 4.0

    # ---------- Settings / Webhook ----------
    AlertThreshold:
      type: object
      required: [metric, warnThreshold, critThreshold]
      properties:
        metric:
          type: string
          enum: [cpu, memory, disk]
          example: cpu
        warnThreshold:
          type: number
          description: warning 阈值（超过触发 warning 告警）
          example: 60
        critThreshold:
          type: number
          description: critical 阈值（超过触发 critical 告警）
          example: 80
        updatedAt:
          type: string
          format: date-time

    UpdateAlertThresholdRequest:
      type: object
      required: [metric, warnThreshold, critThreshold]
      properties:
        metric:
          type: string
          enum: [cpu, memory, disk]
          example: cpu
        warnThreshold:
          type: number
          example: 60
        critThreshold:
          type: number
          example: 80

    WebhookConfig:
      type: object
      required: [id, enabled, kind, url]
      properties:
        id:
          type: integer
          example: 1
        enabled:
          type: boolean
          description: 推送开关
          example: true
        kind:
          type: string
          enum: [dingtalk, wecom]
          description: 渠道类型：钉钉机器人 / 企业微信机器人
          example: dingtalk
        url:
          type: string
          description: 机器人 Webhook 地址
          example: "https://oapi.dingtalk.com/robot/send?access_token=xxx"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WebhookConfigUpdate:
      type: object
      required: [enabled, kind, url]
      properties:
        enabled:
          type: boolean
          description: 推送开关
        kind:
          type: string
          enum: [dingtalk, wecom]
          description: 渠道类型
        url:
          type: string
          description: 机器人 Webhook 地址（以 http/https 开头）
        secret:
          type: string
          description: 加签密钥（可选，钉钉安全设置用；留空表示不修改）

    # ---------- RBAC 角色权限配置 ----------
    CreateRoleRequest:
      type: object
      required: [name, label]
      properties:
        name:
          type: string
          description: 角色标识（小写字母/数字/连字符，2-32 位）
          example: auditor
        label:
          type: string
          description: 角色中文名
          example: 审计员
        description:
          type: string
          description: 角色说明

    UpdateRoleRequest:
      type: object
      properties:
        label:
          type: string
          description: 角色中文名（内置角色不可修改显示名）
        description:
          type: string
          description: 角色说明

    AuditLog:
      type: object
      required: [id, actor, action, target, detail, createdAt]
      properties:
        id:
          type: string
        actor:
          type: string
          description: 操作人用户名
        action:
          type: string
          description: 动作枚举（role.create / role.update / role.delete / permission.update / user.create / user.update / user.delete）
          example: permission.update
        target:
          type: string
          description: 操作对象描述
          example: 角色 operator
        detail:
          type: string
          description: 变更详情（JSON 字符串）
        createdAt:
          type: string
          format: date-time
          description: 操作时间

    RoleInfo:
      type: object
      required: [name, label, description, builtin, locked, permissions]
      properties:
        name:
          type: string
          description: 角色标识（admin / operator / viewer）
          example: operator
        label:
          type: string
          description: 角色中文名
          example: 运维
        description:
          type: string
          description: 角色说明
        builtin:
          type: boolean
          description: 是否内置角色（内置角色不可删除）
        locked:
          type: boolean
          description: 是否锁定（admin 为通配策略，权限不可修改）
        permissions:
          type: array
          description: 该角色当前拥有的权限点（obj:act 列表）
          items:
            type: string
            example: 'agent:deploy'

    PermissionGroup:
      type: object
      required: [obj, label, permissions]
      properties:
        obj:
          type: string
          description: 权限点资源对象（资源分组 key）
          example: agent
        label:
          type: string
          description: 分组中文名
          example: Agent
        permissions:
          type: array
          description: 该分组下的权限点（obj:act 列表）
          items:
            type: string
            example: 'agent:create'
        requires:
          type: object
          description: 组内权限点的前置依赖映射（键=权限点，值=其依赖的入口权限点）。如 webhook:update → webhook:read；无依赖的分组省略此字段
          additionalProperties:
            type: string
            example: 'webhook:read'

    UpdateRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: 覆盖设置的角色权限点（obj:act 列表，必须为系统已注册权限点）
          items:
            type: string
            example: 'agent:read'

    # ---------- Auth ----------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: "********"

    LoginResponse:
      type: object
      required: [token, user, permissions]
      properties:
        token:
          type: string
          description: JWT Token
        user:
          $ref: '#/components/schemas/UserItem'
        permissions:
          type: array
          items:
            type: string
          description: 当前用户权限点列表，如 ["user:read","webhook:update"]

    MeResponse:
      type: object
      required: [user, permissions]
      properties:
        user:
          $ref: '#/components/schemas/UserItem'
        permissions:
          type: array
          items:
            type: string

    # ---------- User ----------
    UserItem:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
          example: admin
        role:
          type: string
          enum: [admin, operator, viewer]
          description: 角色：管理员 / 运维 / 观察者
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]

    UpdateUserRequest:
      type: object
      properties:
        password:
          type: string
          description: 新密码，留空表示不修改
        role:
          type: string
          enum: [admin, operator, viewer]

    # ---------- Agent ----------
    AgentAuthType:
      type: string
      enum: [password, key]
      description: SSH 认证方式：密码 / 密钥

    AgentTarget:
      type: object
      required: [id, name, host, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
          example: prod-web-01
        host:
          type: string
          example: 192.168.1.10
        port:
          type: integer
          description: SSH 端口
          default: 22
        username:
          type: string
        authType:
          $ref: '#/components/schemas/AgentAuthType'
        deployDir:
          type: string
        agentPort:
          type: integer
          description: Agent 采集服务端口
          default: 9100
        status:
          type: string
          enum: [running, stopped, deploying]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAgentRequest:
      type: object
      required: [name, host]
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        authType:
          $ref: '#/components/schemas/AgentAuthType'
        password:
          type: string
          description: SSH 密码（仅入站，不序列化返回）
        deployDir:
          type: string
        agentPort:
          type: integer

    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        authType:
          $ref: '#/components/schemas/AgentAuthType'
        password:
          type: string
          description: 新密码，留空表示不修改
        deployDir:
          type: string
        agentPort:
          type: integer

    AgentStatus:
      type: object
      properties:
        running:
          type: boolean
          description: Agent 进程是否在运行
        pid:
          type: integer
        version:
          type: string
        uptimeSec:
          type: integer