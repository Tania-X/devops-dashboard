services:
  # 前端：Nginx 托管静态产物 + 反代后端
  web:
    # 生产默认拉 ghcr.io 镜像；本地开发想重新构建时：
    #   WEB_IMAGE=devops-dashboard-web docker compose up -d --build
    image: ${WEB_IMAGE:-ghcr.io/tania-x/devops-dashboard/web:0.2.1}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

  # 后端：Go API + SQLite
  server:
    image: ${SERVER_IMAGE:-ghcr.io/tania-x/devops-dashboard/server:0.2.1}
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/storage:/data
    environment:
      - PORT=8080
      - ENV=prod
      - JWT_SECRET=${JWT_SECRET:-devops-dashboard-jwt-secret}
      - AGENT_HOSTS=${AGENT_HOSTS:-}
    restart: unless-stopped
    # 不对外暴露端口，只通过 web 反代访问（如需直连可取消注释）
    # ports:
    #   - "8081:8080"

  # 可选：本地起一个 agent 方便测试
  agent:
    image: ${AGENT_IMAGE:-ghcr.io/tania-x/devops-dashboard/agent:0.2.1}
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    ports:
      - "9100:9100"
    restart: unless-stopped
    profiles:
      - agent
